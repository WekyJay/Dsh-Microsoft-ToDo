# Microsoft To Do: the MCP bridge (agent tools) and the Web panel (host + client).
- insert:
    - id: microsoft-todo
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: microsoft_todo
        transport: stdio
        command: npx
        args: ['-y', 'microsoft-todo-mcp']
        env: {}
        cwd: ''
        toolCallTimeoutMs: 60000
        startupTimeoutMs: 60000
        closeTimeoutMs: 5000
        expandTemplates: false
        failOnStartupError: true
    - id: microsoft-todo-page
      name: 'dsh-microsoft-todo'
